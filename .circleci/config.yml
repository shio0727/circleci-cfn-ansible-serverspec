# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1


orbs:
  aws-cli: circleci/aws-cli@4.1.3
  aws-cloudformation: orbss/aws-cloudformation@0.1.6
  ansible-playbook: orbss/ansible-playbook@0.0.5
 

# Define a job to be invoked later in a workflow.
# See: https://circleci.com/docs/jobs-steps/#jobs-overview & https://circleci.com/docs/configuration-reference/#jobs
jobs:
  execute-cloudformation:
    executor: aws-cloudformation/default
    steps:
      - checkout
      - aws-cli/setup:
          aws_access_key_id: AWS_ACCESS_KEY_ID
          aws_secret_access_key: AWS_SECRET_ACCESS_KEY
          region: AWS_DEFAULT_REGION
      - aws-cloudformation/deploy:
          stack-name: "lecture13-network-stack"
          template-file-path: "cloudformation/network.yml"
      - aws-cloudformation/deploy:
          stack-name: "lecture13-security-stack"
          template-file-path: "cloudformation/security.yml"
      - aws-cloudformation/deploy:
          stack-name: "lecture13-app1-stack"
          template-file-path: "cloudformation/application1.yml"
          capabilities: CAPABILITY_NAMED_IAM
      - aws-cloudformation/deploy:
          stack-name: "lecture13-app2-stack"
          template-file-path: "cloudformation/application2.yml"
      - aws-cloudformation/deploy:
          stack-name: "lecture13-app3-stack"
          template-file-path: "cloudformation/application3.yml"
          capabilities: CAPABILITY_NAMED_IAM
      - aws-cloudformation/deploy:
          stack-name: "lecture13-app4-stack"
          template-file-path: "cloudformation/application4.yml"
          
  get-variables-from-cfn:
    executor: aws-cli/default
    steps:
      - checkout
      - run:  # 環境変数の設定
          name: set environment variables in .env_var
          command: |
            # Define variables
            # スタックの名前とシクレットマネージャーの名前を設定
            STACK_NAME="application2.yml" 
            STACK_NAME2="application3.yml"
            STACK_NAME3="application4.yml"
            SECRET_NAME="MyRDSSecret"
            REGION="ap-northeast-1"
            # RDSのエンドポイントを環境変数に設定
            RDS_ENDPOINT=$(aws cloudformation describe-stacks --stack-name $STACK_NAME --query "Stacks[0].Outputs[?OutputKey=='RDSInstanceEndpoint'].OutputValue" --output text --region $REGION)
            echo "export RDS_ENDPOINT=$(printf '%q' $RDS_ENDPOINT)" >> .env_var
            # RDSのパスワードを環境変数に設定
            RDS_PASSWORD=$(aws secretsmanager get-secret-value --secret-id $SECRET_NAME --query "SecretString" --output text --region $REGION | jq -r '.password')
            echo "export RDS_PASSWORD=$(printf '%q' $RDS_PASSWORD)" >> .env_var
            # ロードバランサーのDNSを環境変数に出力して設定
            DNS_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME2 --query "Stacks[0].Outputs[?OutputKey=='ALBEndpoint'].OutputValue" --output text --region $REGION)
            echo "export DNS_NAME=$DNS_NAME" >> .env_var
            # S3を出力して環境変数に設定
            S3_NAME=$(aws cloudformation describe-stacks --stack-name $STACK_NAME3 --query "Stacks[0].Outputs[?OutputKey=='S3BucketName'].OutputValue" --output text --region $REGION)
            echo "export S3_NAME=$S3_NAME" >> .env_var
      - run:
          name: check environment variables
          command: |
            source .env_var
            echo "RDS_ENDPOINT: $RDS_ENDPOINT"
            echo "RDS_PASSWORD: $RDS_PASSWORD"
            echo "DNS_NAME: $DNS_NAME"
            echo "S3_NAME: $S3_NAME"
          no_output_timeout: 30m
      - persist_to_workspace:
          root: .
          paths:
            - .env_var
            
  execute-ansible:
    executor: ansible-playbook/default
    steps:
      - checkout
      - attach_workspace:
          at: .
      - add_ssh_keys:
          fingerprints:
            - SHA256:1L4djQiuMIWSJwXsMSIW9HJqz7IjPsQpARLqhU6H+o0
      - ansible-playbook/install:
          version: 2.9.23
      - run:
          name: Install Ansible
          command: pip install ansible
      - run:
          name: Create required directories
          command: |
            mkdir -p ~/.ansible/collections/ansible_collections
      - run:
          name: Verify directories
          command: |
            ls -la ~/.ansible/collections/
      - run:
          name: Install Ansible Galaxy Collections
          command: ansible-galaxy collection install amazon.aws
      - run:
          name: Install Ansible Galaxy Collections
          command: ansible-galaxy collection install community.mysql
      - run:
          name: Use Environment Variable
          command: |
            source .env_var
            echo $RDS_ENDPOINT
            echo $RDS_PASSWORD
            echo $DNS_NAME
            echo $S3_NAME
      - run:
          name: Replacing environment variables in Sed
          command: |
            source .env_var
            sed -i "s/RDS_ENDPOINT/${RDS_ENDPOINT}/g" ansible/playbook.yml
            sed -i "s/RDS_PASSWORD/${RDS_PASSWORD}/g" ansible/playbook.yml
            sed -i "s/DNS_NAME/${DNS_NAME}/g" ansible/playbook.yml
            sed -i "s/S3_NAME/${S3_NAME}/g" ansible/playbook.yml
            cat ansible/playbook.yml
          no_output_timeout: 30m
      - ansible-playbook/playbook:
          playbook: ansible/playbook.yml
          playbook-options: -u ec2-user -i ansible/inventory --private-key ~/.ssh/authorized_key
      
          
# Orchestrate jobs using workflows
# See: https://circleci.com/docs/workflows/ & https://circleci.com/docs/configuration-reference/#workflows
workflows:
  lecture13-workflow:
    jobs:
      - execute-cloudformation
      - execute-ansible:
          requires:
            - execute-cloudformation
  
# This is the name of the workflow, feel free to change it to better match your workflow.
    # Inside the workflow, you define the jobs you want to run.
