---
- hosts: all
  become: yes
  
  tasks:
    - name: Include 01-yum
      include_role:
        name: 01-yum

    - name: Include 02-git
      include_role:
        name: 02-git
        
    - name: Include 03-ryby
      include_role:
        name: 03-ruby
        
    - name: Include 04-node
      include_role:
        name: 04-node
  
  vars: 
    app_dir: /home/ec2-user/raisetech-live8-sample-app
    ansible_user: ec2-user
    MasterUserPassword: "RDS_PASSWORD"
    EndpointAddress: "RDS_ENDPOINT"