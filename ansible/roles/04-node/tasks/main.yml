---

- name: check if node.js is installed
  shell: "node --version | grep {{ nodejs_version }}"
  register: node_check
  changed_when: no
  ignore_errors: true


- name: Download and install NVM
  shell: >
    curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/{{ nvm_version }}/install.sh | bash
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
    mode: '775'
  when: node_check is failed
 

- name: Copy nvm.sh to /etc/profile.d
  become: true
  copy:
    src: roles/04-node/templates/nvm.sh.j2
    dest: /etc/profile.d/nvm.sh
  when: node_check is failed

- name: Add NVM source lines to .bash_profile
  become_user: "{{ ansible_user }}"
  lineinfile:
    path: /home/{{ ansible_user }}/.bash_profile
    line: |
      export NVM_DIR="/home/{{ ansible_user }}/.nvm"
      [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
    create: yes
  when: node_check is failed
  
- name: Source .bash_profile
  shell: bash -lc 'source /home/{{ ansible_user }}/.bash_profile'
  become_user: "{{ ansible_user }}"
  when: node_check is failed

- name: node.js
  #become: true
  shell: "bash -lc 'nvm install {{ nodejs_version }}'"
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
  when: node_check is failed
  ignore_errors: true


- name: node install
  become: true
  shell: "bash -lc 'nvm alias default {{ nodejs_version }}'"
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
  when: node_check is failed

- name: installed yarn {{ yarn_version }}
  shell: |
    yarn --version | grep {{ yarn_version }}
  register: yarn_check
  changed_when: no
  ignore_errors: true

- name: Install yarn globally
  shell: bash -lc "npm install --global yarn@{{ yarn_version }}"
  args:
    executable: /bin/bash
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
  when: yarn_check is failed
  
- name: Change ownership of directories
  file:
    path: /home/ec2-user/.rbenv/versions/3.2.3
    state: directory
    owner: ec2-user
    group: ec2-user
    recurse: yes
    
- name: Run bundle install as normal user 
  become: no
  shell: bash -lc 'bundle install'
  args:
    chdir: "{{ app_dir }}"
