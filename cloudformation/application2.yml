AWSTemplateFormatVersion: 2010-09-09
Description: Application_Layer Template

Parameters:
  Namebase:
    Type: String
    Default: lecture13
    
  RDSMasterUsername:
    Description: "RDS Master User Name"
    Type: String
    Default: Admin
    
  #RDSUserPassword:
  # パラメータ値をマスク
  #  NoEcho: true
  #  Description: "RDS Master User Password"
  #  Type: String
  #  MinLength: 8
  #  MaxLength: 128
  #  AllowedPattern: "[a-zA-Z0-9]*"
  
Resources:
  MyDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "parametergroup"
      Family: mysql8.0
      Parameters:
        time_zone: UTC

  # rds作成
  RDS:
    Type: AWS::RDS::DBInstance
    Properties:
      StorageType: gp2
      AllocatedStorage: 20
      PubliclyAccessible: false
      AvailabilityZone: !Select 
        - 0
        - Fn::GetAZs: !Ref AWS::Region
      DBInstanceClass: db.t3.micro
      Port: 3306
      BackupRetentionPeriod: 7
      MasterUsername: !Ref RDSMasterUsername
      MasterUserPassword: !Sub "{{resolve:ssm-secure:/lecture13/rds-pass}}"
      DBInstanceIdentifier: !Sub ${Namebase}-rds
      DBName: RDS10
      DBParameterGroupName: !Ref MyDBParameterGroup
      Engine: MySQL
      EngineVersion: 8.0.35
      DBSubnetGroupName: !Ref RDSSubnetgroup
      VPCSecurityGroups:
        - !ImportValue lecture13-SecurityGroupRDS
        
  # サブネットグループ
  RDSSubnetgroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: for RDS
      DBSubnetGroupName: lecture13RDSSubnetgroup
      SubnetIds:
        - !ImportValue lecture13-PrivateSubnet1id
        - !ImportValue lecture13-PrivateSubnet2id
